<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор антенны «Паук» (136–174 МГц)</title>
    <style>
        :root {
            --bg-color: #e4ebf5;
            --text-color: #333333;
            --text-muted: #666666;
            --card-bg: #e4ebf5;
            --shadow-light: #ffffff;
            --shadow-dark: #c8d0e7;
            --accent-color: #0066cc;
            --input-bg: #e4ebf5;
            --font-size-base: 16px;
            --shadow-intensity: 1;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #1a1d24;
            --text-color: #e1e8ed;
            --text-muted: #9aa0a6;
            --card-bg: #1a1d24;
            --shadow-light: #252a34;
            --shadow-dark: #0f1115;
            --accent-color: #3b82f6;
            --input-bg: #161920;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            font-size: var(--font-size-base);
            position: relative;
        }

        /* ЭТАЛОННЫЙ ВОДЯНОЙ ЗНАК «БЛiК» СТРОГО В ЛЕВОМ НИЖНЕМ УГЛУ ОКНА ПРИЛОЖЕНИЯ */
        .watermark-blik {
            position: fixed;
            bottom: 20px;
            left: 20px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 50;
            user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 0.1em;
            color: var(--text-color);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 28px;
            box-shadow: calc(12px * var(--shadow-intensity)) calc(12px * var(--shadow-intensity)) calc(24px * var(--shadow-intensity)) var(--shadow-dark), 
                        calc(-12px * var(--shadow-intensity)) calc(-12px * var(--shadow-intensity)) calc(24px * var(--shadow-intensity)) var(--shadow-light);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .icon-btn {
            background: var(--card-bg);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            color: var(--text-color);
            font-size: 1.2rem;
            transition: transform 0.1s ease;
        }

        .icon-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            transform: scale(0.96);
        }

        /* 3D Схема антенны */
        .schema-container {
            width: 100%;
            height: 180px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .schema-container svg {
            width: 100%;
            height: 100%;
        }

        .clickable-part {
            cursor: pointer;
            transition: filter 0.2s;
        }
        .clickable-part:hover {
            filter: drop-shadow(0 0 4px var(--accent-color));
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-wrapper {
            background: var(--input-bg);
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            padding: 4px 16px;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: 600;
            padding: 10px 0;
        }

        .unit {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        .presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .preset-btn {
            background: var(--card-bg);
            border: none;
            padding: 8px 0;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }
        .preset-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--card-bg);
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            text-align: center;
        }
        .btn-primary {
            color: var(--accent-color);
        }
        .btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            transform: scale(0.98);
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .result-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .result-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Модальное окно настроек */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }
        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 380px;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .setting-select, .setting-range {
            background: var(--input-bg);
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            color: var(--text-color);
            outline: none;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
    </style>
</head>
<body>

    <!-- ЭТАЛОННЫЙ ВОДЯНОЙ ЗНАК БЛiК В ЛЕВОМ НИЖНЕМ УГЛУ -->
    <div class="watermark-blik" aria-hidden="true">БЛiК</div>

    <div class="app-container">
        <div class="header">
            <h1>Паук 136–174 МГц</h1>
            <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
        </div>

        <!-- 3D Интерактивная схема -->
        <div class="schema-container">
            <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                <!-- Кабель фидер снизу -->
                <path d="M100,105 Q100,135 120,150" stroke="#888" stroke-width="4" fill="none" stroke-dasharray="2,2"/>
                <!-- Корпус / Узел -->
                <circle cx="100" cy="90" r="12" fill="url(#metalGrad)" stroke="#555" stroke-width="1.5"/>
                <!-- Элемент 2: Центральный штырь -->
                <line x1="100" y1="90" x2="100" y2="25" stroke="var(--accent-color)" stroke-width="4" class="clickable-part" id="svgRod" onclick="highlightPart('rod')"/>
                <!-- Элемент 7: Лучи противовесы -->
                <line x1="100" y1="90" x2="50" y2="120" stroke="var(--accent-color)" stroke-width="3" class="clickable-part" id="svgRad1" onclick="highlightPart('rad')"/>
                <line x1="100" y1="90" x2="150" y2="120" stroke="var(--accent-color)" stroke-width="3" class="clickable-part" id="svgRad2" onclick="highlightPart('rad')"/>
                <line x1="100" y1="90" x2="35" y2="95" stroke="var(--accent-color)" stroke-width="3" class="clickable-part"/>
                <line x1="100" y1="90" x2="165" y2="95" stroke="var(--accent-color)" stroke-width="3" class="clickable-part"/>
                <defs>
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ccc"/>
                        <stop offset="100%" stop-color="#666"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="input-group">
            <label for="freqInput">Частота (136.00 – 174.00 МГц)</label>
            <div class="input-wrapper">
                <input type="number" id="freqInput" min="136" max="174" step="0.01" value="145.00">
                <span class="unit">МГц</span>
            </div>
            <div class="error-msg" id="errorMsg">Введите частоту строго от 136 до 174 МГц</div>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="setFreq(136.00)">136.00</button>
            <button class="preset-btn" onclick="setFreq(145.00)">145.00</button>
            <button class="preset-btn" onclick="setFreq(150.00)">150.00</button>
            <button class="preset-btn" onclick="setFreq(174.00)">174.00</button>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="calculate()">РАССЧИТАТЬ</button>
            <button class="btn" onclick="clearFields()">ОЧИСТИТЬ</button>
        </div>

        <div class="results-grid">
            <div class="result-card" id="cardRod">
                <div class="result-title">ЦЕНТРАЛЬНЫЙ ШТЫРЬ: </div>
                <div>
                    <div class="result-value" id="resRod">49.14</div>
                    <div class="result-sub">см</div>
                </div>
            </div>
            <div class="result-card" id="cardRad">
                <div class="result-title">ЛУЧИ: </div>
                <div>
                    <div class="result-value" id="resRad">50.00</div>
                    <div class="result-sub">см</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="icon-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="setting-row">
                <span>Тема оформления</span>
                <select id="themeSelect" class="setting-select">
                    <option value="light">Светлая</option>
                    <option value="dark">Темная</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Акцентный цвет</span>
                <select id="colorSelect" class="setting-select">
                    <option value="#0066cc">Синий</option>
                    <option value="#10b981">Зеленый</option>
                    <option value="#f59e0b">Оранжевый</option>
                    <option value="#8b5cf6">Фиолетовый</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Объем 3D теней</span>
                <input type="range" id="shadowRange" class="setting-range" min="0.5" max="1.5" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script>
        const freqInput = document.getElementById('freqInput');
        const errorMsg = document.getElementById('errorMsg');
        const resRod = document.getElementById('resRod');
        const resRad = document.getElementById('resRad');
        const cardRod = document.getElementById('cardRod');
        const cardRad = document.getElementById('cardRad');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const themeSelect = document.getElementById('themeSelect');
        const colorSelect = document.getElementById('colorSelect');
        const shadowRange = document.getElementById('shadowRange');

        // Управление темой
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeSelect.value = theme;
            localStorage.setItem('spider_theme', theme);
        }

        themeSelect.addEventListener('change', (e) => setTheme(e.target.value));

        // Инициализация темы
        const savedTheme = localStorage.getItem('spider_theme') || 'dark';
        setTheme(savedTheme);

        // Настройки цвета и теней
        colorSelect.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--accent-color', e.target.value);
            localStorage.setItem('spider_color', e.target.value);
        });
        const savedColor = localStorage.getItem('spider_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--accent-color', savedColor);
            colorSelect.value = savedColor;
        }

        shadowRange.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--shadow-intensity', e.target.value);
        });

        // Модальное окно
        settingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));
        closeModalBtn.addEventListener('click', () => settingsModal.classList.remove('open'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('open');
        });

        function setFreq(val) {
            freqInput.value = val.toFixed(2);
            calculate();
        }

        function clearFields() {
            freqInput.value = '';
            resRod.innerText = '0.00';
            resRad.innerText = '0.00';
            errorMsg.style.display = 'none';
        }

        function calculate() {
            const f = parseFloat(freqInput.value);
            if (isNaN(f) || f < 136 || f > 174) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            // Формулы расчета под диапазон 136–174 МГц
            const rod = 7125 / f;
            const rad = 7250 / f;

            resRod.innerText = rod.toFixed(2);
            resRad.innerText = rad.toFixed(2);
        }

        function highlightPart(part) {
            if (part === 'rod') {
                cardRod.style.transform = 'scale(1.05)';
                setTimeout(() => cardRod.style.transform = 'none', 300);
            } else {
                cardRad.style.transform = 'scale(1.05)';
                setTimeout(() => cardRad.style.transform = 'none', 300);
            }
        }

        freqInput.addEventListener('input', calculate);
        calculate();
    </script>
</body>
</html>
